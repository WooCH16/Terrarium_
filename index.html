<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' file:; style-src 'self' 'unsafe-inline' file: https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'none'">
<title>관제탑 메인</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main id="stage" class="stage">

  <!-- 전체: 오케스트라 대화 + 오퍼레이터 카드 -->
  <section id="view-main" class="view">
    <div id="arrows"></div>
    <div class="chat">
      <header class="chat-head">
        <div class="chat-title"><span class="brand">ORCHESTRA</span><span class="sub">사용자와 대화 세션</span></div>
        <span class="api-log"></span>
        <span class="online"><span class="live"></span>ONLINE</span>
      </header>
      <div id="messages" class="messages" aria-live="polite"></div>
      <!-- 데스크톱 앱에서는 이 자리에 코디네이터 터미널이 뜬다(js/terminal.js) -->
      <div id="term" class="term" hidden></div>
      <form id="chat-form" class="chat-form">
        <label for="orch-input">USER ›</label>
        <input id="orch-input" type="text" autocomplete="off" placeholder="예: 보안팀 일시정지 / 디자인 작업 시작">
        <button type="submit">SEND</button>
      </form>
    </div>
    <div id="cards"></div>
  </section>

  <!-- 팀 상세 -->
  <section id="view-team" class="view" hidden>
    <div id="team-panel" class="panel">
      <header class="panel-head">
        <div class="head-left"><button type="button" class="back" data-view="main">← 전체</button><span id="team-title" class="panel-title"></span></div>
        <span class="api-log"></span>
      </header>
      <div class="team-body">
        <div id="team-stats" class="stats"></div>
        <div id="team-op"></div>
        <div id="team-lines"></div>
        <div id="team-workers"></div>
        <div class="activity"><span class="cap">ACTIVITY</span><div id="team-logs" class="logs"></div></div>
      </div>
    </div>
  </section>

  <!-- 통합 -->
  <section id="view-total" class="view" hidden>
    <div class="panel panel-total">
      <header class="panel-head">
        <div class="head-left"><button type="button" class="back" data-view="main">← 전체</button><span class="panel-title">통합</span><span class="panel-sub">전체 팀 현황</span></div>
        <span class="api-log"></span>
      </header>
      <div class="total-body">
        <div id="total-stats" class="stats"></div>
        <div class="grid-cols table-head"><span>팀</span><span>상태</span><span>호출 워커</span><span>작업중 워커</span><span>평균 진행률</span></div>
        <div id="total-rows" class="rows"></div>
        <div class="dist-wrap"><span class="cap">STATUS</span><div id="total-dist" class="dist"></div></div>
      </div>
    </div>
  </section>

  <!-- 사무실 -->
  <section id="view-office" class="view" hidden>
    <div class="office">
      <img class="office-map" src="assets/office.png" width="720" height="600" alt="사무실 8비트 픽셀 아트: 작업실, 탕비실, 휴게실, 수면실">
      <div class="room" style="left: 22px; top: 29px">작업실</div>
      <div class="room" style="left: 454px; top: 29px">탕비실</div>
      <div class="room" style="left: 22px; top: 329px">휴게실</div>
      <div class="room" style="left: 370px; top: 329px">수면실</div>
      <div id="office-screens"></div>
      <div id="office-chars"></div>
      <div id="office-zs"></div>
      <div id="office-tags"></div>
      <div class="office-log api-log"></div>
    </div>
  </section>

  <nav class="sidebar" aria-label="세션">
    <div class="side-head"><span class="side-title">SESSIONS</span><span id="work-count" class="work-count"></span></div>
    <div class="side-body">
      <div class="side-cap">VIEW</div>
      <div class="tabs">
        <button type="button" class="nav tab" data-mode="matrix" aria-pressed="true">매트릭스</button>
        <button type="button" class="nav tab" data-mode="office" aria-pressed="false">사무실</button>
      </div>
      <div class="sep" role="separator"></div>
      <div class="side-cap">OPERATORS</div>
      <button type="button" class="nav item item-all" data-view="main">전체</button>
      <button type="button" class="nav item" data-team="dev">개발팀</button>
      <button type="button" class="nav item" data-team="design">디자인</button>
      <button type="button" class="nav item" data-team="tester">테스터</button>
      <button type="button" class="nav item" data-team="plan">기획</button>
      <button type="button" class="nav item" data-team="sec">보안팀</button>
      <button type="button" class="nav item item-total" data-view="total">통합</button>
      <button type="button" id="open-settings" class="nav item item-settings" hidden>설정</button>
    </div>
  </nav>

</main>

<!-- 데스크톱 앱에서만: 오른쪽 빈 공간의 폴더 패널(js/files.js). 수정 중 = 주황, 수정 완료 = 초록(다음 지시 전까지) -->
<aside id="files" class="files" aria-label="폴더" hidden>
  <div class="files-head">
    <span class="side-title">FILES</span>
    <button type="button" id="files-pick" class="files-pick" title="보일 폴더 고르기">폴더…</button>
  </div>
  <div id="files-root" class="files-root"></div>
  <div class="files-legend"><span class="editing">● 수정 중</span><span class="done">● 수정 완료</span></div>
  <div id="files-tree" class="files-tree" role="tree"></div>
</aside>
<script src="js/api.js"></script>
<script src="js/live.js"></script>
<script src="js/app.js"></script>
<script src="js/terminal.js"></script>
<script src="js/files.js"></script>
</body>
</html>
