# Terrarium 하네스 하달 PR (결정 8-32). 하네스가 하달의 이슈를 다 합친 integration/h<N>을 올리면
# main으로 가는 하달 PR을 열고 CI를 부른다. 결과는 PR의 검사 상태로 남고 하네스가 읽는다(gh pr checks).
# main보다 앞선 커밋이 없으면(이슈 PR의 시작점만 올라온 때) PR을 열지 않고 끝낸다.
# 이 PR은 직접 머지하지 않는다. main 머지는 사용자 승인 뒤 harness-train.yml이 한다.
# 결정 8-35: 하네스가 통합 브랜치를 허용된 이슈만으로 다시 만들어 올리면(강제 push) 열린 하달 PR을 닫지 않고 새 끝으로 갱신한다
# (머리 커밋은 push로 바뀐다. 다시 만들었다는 댓글을 남기고 CI를 다시 부른다). 반려로 빠진 이슈의 이슈 PR은 새 하달에서 harness-issue-pr.yml이 닫는다.
name: harness-handoff-pr

on:
  push:
    branches:
      - 'integration/h*'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: harness-handoff-pr-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  open-pr:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.pr.outputs.sha }}
      skip: ${{ steps.pr.outputs.skip }}
    steps:
      - name: 브랜치 모양 확인, 하달 PR 열기
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          FORCED: ${{ github.event.forced }}
        run: |
          set -euo pipefail
          if [[ ! "$BRANCH" =~ ^integration/(h[1-9][0-9]{0,8})$ ]]; then
            echo "::error::하네스 통합 브랜치 모양(integration/h<N>)이 아니다"
            exit 1
          fi
          HANDOFF="${BASH_REMATCH[1]}"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          AHEAD=$(gh api "repos/$REPO/compare/main...$SHA" --jq '.ahead_by')
          if [ "$AHEAD" = "0" ]; then
            echo "main보다 앞선 커밋이 없다(이슈 PR의 시작점). 하달 PR을 열지 않는다"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          NUM=$(gh pr list --repo "$REPO" --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty')
          if [ -n "$NUM" ]; then
            echo "하달 PR #$NUM이 이미 있다(머리 커밋이 바뀌었다)"
            if [ "$FORCED" = "true" ]; then
              gh pr comment "$NUM" --repo "$REPO" --body "통합 브랜치를 허용된 이슈만으로 다시 만들었다(결정 8-35). 새 머리 커밋: $SHA. 빠진 이슈는 새 하달로 재작업한다." || echo "::warning::댓글을 남기지 못했다"
            fi
            exit 0
          fi
          BODY="하네스 하달 PR(결정 8-32). 하달 $HANDOFF의 이슈들을 합친 통합 브랜치.
          직접 머지하지 않는다. 사용자가 머지 트레인을 승인하면 harness-train.yml이 CI 뒤 main에 머지하고 이 PR을 닫는다."
          gh pr create --repo "$REPO" --base main --head "$BRANCH" --title "하달 $HANDOFF" --body "$BODY"

  ci:
    needs: open-pr
    if: needs.open-pr.outputs.skip != 'true'
    uses: ./.github/workflows/harness-ci.yml
    with:
      ref: ${{ needs.open-pr.outputs.sha }}
