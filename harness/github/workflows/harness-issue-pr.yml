# Terrarium 하네스 이슈 PR (결정 8-32). 하네스가 리뷰어 허용 뒤 h<N>/issue-<번호>를 올리면
# integration/h<N>으로 가는 이슈 PR을 열고(이미 열려 있으면 push가 머리 커밋을 바꾼 것이다) CI를 부른다.
# 하네스는 이 PR을 읽기만 한다(gh pr list·checks). PR 본문에는 지정 저장소 이슈 링크만 단다(이슈 본문·판정 원문은 옮기지 않는다:
# 공개 저장소면 남이 읽을 수 있고, 지정 저장소 링크는 남이 열 수 없다).
# 저장소 설정에서 "Allow GitHub Actions to create and approve pull requests"가 켜져 있어야 PR을 연다(확인 필요: 설정 이름).
name: harness-issue-pr

on:
  push:
    branches:
      - 'h*/issue-*'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: harness-issue-pr-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  open-pr:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.pr.outputs.sha }}
      skip: ${{ steps.pr.outputs.skip }}
    steps:
      - name: 브랜치 모양 확인, 이슈 PR 열기
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          ISSUES_REPO: '{{REPO}}'
        run: |
          set -euo pipefail
          if [[ ! "$BRANCH" =~ ^(h[1-9][0-9]{0,8})/issue-([1-9][0-9]{0,8})$ ]]; then
            echo "::error::하네스 이슈 브랜치 모양(h<N>/issue-<번호>)이 아니다"
            exit 1
          fi
          HANDOFF="${BASH_REMATCH[1]}"
          ISSUE="${BASH_REMATCH[2]}"
          BASE="integration/$HANDOFF"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          if ! gh api "repos/$REPO/branches/$BASE" --silent; then
            echo "::error::$BASE가 원격에 없다(하네스의 push-branch가 먼저 올린다)"
            exit 1
          fi
          AHEAD=$(gh api "repos/$REPO/compare/$BASE...$SHA" --jq '.ahead_by')
          if [ "$AHEAD" = "0" ]; then
            echo "$BASE에 이미 들어 있어 이슈 PR을 열지 않는다"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          NUM=$(gh pr list --repo "$REPO" --head "$BRANCH" --base "$BASE" --state open --json number --jq '.[0].number // empty')
          if [ -n "$NUM" ]; then
            echo "이슈 PR #$NUM이 이미 있다(머리 커밋이 바뀌었다)"
            exit 0
          fi
          BODY="하네스 이슈 PR(결정 8-32). 하달 $HANDOFF, 이슈 #$ISSUE.
          이슈와 리뷰어 판정: https://github.com/$ISSUES_REPO/issues/$ISSUE (지정 저장소, 비공개)
          이슈 본문과 판정 원문은 옮기지 않는다. 머지는 하달 PR과 머지 트레인이 한다."
          gh pr create --repo "$REPO" --base "$BASE" --head "$BRANCH" --title "이슈 #$ISSUE ($HANDOFF)" --body "$BODY"

  ci:
    needs: open-pr
    if: needs.open-pr.outputs.skip != 'true'
    uses: ./.github/workflows/harness-ci.yml
    with:
      ref: ${{ needs.open-pr.outputs.sha }}
